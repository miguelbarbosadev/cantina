name: cantina_app
description: "Cantina da Faculdade — Trabalho NP2 Desenvolvimento Mobile (Flutter + Firebase + ViaCEP)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0 # RadioGroup exige Flutter 3.35+

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.0
  cloud_firestore: ^6.0.1
  http: ^1.5.0 # recurso adicional (ViaCEP)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
